<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="robots" content="noindex">

    <title>Shop Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             LOGIN
        ========================== -->
        <section id="login" class="card login-card">

            <h1>Shop Admin</h1>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        type="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginError" class="error" role="alert"></p>

                <button type="submit" class="button button-primary">
                    Log in
                </button>

            </form>

        </section>


        <!-- =========================
             ADMIN APPLICATION
        ========================== -->
        <main id="app" hidden>

            <!-- Header -->
            <header class="top-bar">

                <h1>Shop Admin</h1>

                <div class="header-actions">
                    <a
                        href="/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View Shop
                    </a>

                    <button id="logoutButton" class="button">
                        Log Out
                    </button>
                </div>

            </header>


            <!-- =========================
                 STATISTICS
            ========================== -->

            <section id="statistics" class="statistics">
                <!-- Statistics generated by JavaScript -->
            </section>


            <!-- =========================
                 NAVIGATION / FILTER
            ========================== -->

            <div class="toolbar">

                <div class="tabs">

                    <button
                        class="tab-button active"
                        data-tab="orders"
                        aria-pressed="true"
                    >
                        Orders
                    </button>

                    <button
                        class="tab-button"
                        data-tab="products"
                        aria-pressed="false"
                    >
                        Perfumes
                    </button>

                </div>


                <select id="statusFilter" class="status-filter">
                    <option value="">All orders</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>

            </div>


            <!-- General error message -->
            <p id="appError" class="error" role="alert"></p>


            <!-- =========================
                 ORDERS
            ========================== -->

            <section id="ordersSection">
                <div id="orders">
                    <!-- Orders generated by JavaScript -->
                </div>
            </section>


            <!-- =========================
                 PRODUCTS
            ========================== -->

            <section id="productsSection" hidden>

                <button
                    id="newProductButton"
                    class="button button-primary add-product-button"
                >
                    + Add a Perfume
                </button>

                <!-- Add/Edit form -->
                <div id="productForm"></div>

                <!-- Product list -->
                <div id="productList"></div>

            </section>

        </main>

    </div>


    <script src="admin.js"></script>

</body>
</html>
